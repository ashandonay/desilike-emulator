# Per-tracer config for BAO Fisher forecasts and emulator training.
#
# Schema (per tracer block):
#
#   tracer_type      Category that selects the HOD shape from hod.yaml.
#                    One of: BGS, LRG, ELG, MIX, QSO.
#   zrange           [z_min, z_max] redshift slice covered by the sample
#                    (survey-design quantity; cosmology-independent).
#   bias_recon       Linear bias used at reconstruction time. Fixed by the
#                    DESI BAO analysis (Adame+24 DR1 BAO paper); not a
#                    cosmology-dependent fit value. Used in the Wiener
#                    filter inside `_sigma_nl_post_from_recon`.
#   smoothing_scale  Reconstruction smoothing R [Mpc/h]. DESI uses 15 for
#                    galaxy tracers and 30 for QSO (sparser sample needs
#                    larger smoothing).
#   z_error_kms      (optional) Spectroscopic redshift precision in km/s.
#                    Currently set only for QSO (broad-emission-line
#                    redshifts ~600 km/s). Other tracers use narrow
#                    forbidden lines (~50 km/s), contribution negligible.
#   f_interloper     (optional) Fraction of catalog objects misidentified
#                    (line confusion / catastrophic redshifts). Effect:
#                    multiplies the observed bias by (1 − f_int), since
#                    interlopers are uncorrelated with LSS at the assigned
#                    z and only the (1−f) true fraction carries the signal.
#                    Values: BGS ~0, LRG ~0.002, ELG ~0.07, QSO ~0.02
#                    (Adame+24 Table 2 / DESI SV completeness; Massara+24,
#                    Yuan+24 for ELG modeling). Physics-derivable, no σ
#                    calibration to DESI involved.
#   z_eff            NOT a fallback -- read this before assuming it is unused.
#                    Two pipelines treat it differently, deliberately:
#
#                      config space  AUTHORITATIVE. Every build_bao_likelihood
#                        call in bao/config_space.py passes z_eff=cfg["z_eff"]
#                        explicitly, so for the production sigma-triplet driver
#                        this value IS the z_eff. It must equal the z_eff of the
#                        DESI bundle supplying the window matrix and covariance:
#                        those were measured on that sample and are only
#                        self-consistent with a theory evaluated there.
#                        `_assert_bundle_zeff` enforces it at load_bundle time.
#
#                      Fourier / shapefit  IGNORED. They build their own
#                        analytic covariance, so there is no measured window to
#                        stay consistent with, and they derive z_eff from the
#                        n(z) slices using DESI's FKP-weighted definition
#                        (`_compute_z_eff_from_nz` in bao/core.py) -- letting it
#                        track cosmology and N_tracers.
#
#                    Values here are DR1 (Adame+24 Table 1), matching the DR1
#                    bundles. DR2 differs for LRG3+ELG1/ELG2/QSO
#                    (0.934/1.321/1.484) and is not carried here under the
#                    DR1-first rule; the per-release `overrides` mechanism is
#                    where it belongs when DR2 comes up.
#
# Emulator-sampler config (used only by the training-set generator, not
# by the physics pipeline):
#
#   low, high        N_tracers LHS bounds as MULTIPLICATIVE FACTORS on the DESI
#                    "passed" count: the absolute box is
#                        [low * passed, high * passed]
#                    where passed is read at runtime from
#                    ~/data/desi/bao_{dataset}/desi_data.csv (dataset = dr1|dr2,
#                    chosen with --dataset; see util.ntracers_range). So the
#                    same factors transparently rescale to DR1 or DR2 counts.
#                    Defaults (0.5, 1.5) centre the box on passed (uniform mean
#                    = passed). passed itself derives from observed via the BED
#                    passed-fraction.
#
# Derived quantities NOT listed here (computed inside the pipeline from
# n(z) slices + cosmology):
#   - z_eff          Derived in the Fourier and shapefit paths ONLY, with
#                    DESI's FKP-weighted convention (`_compute_z_eff_from_nz`
#                    in bao/core.py). Config space uses the value above
#                    instead -- see its schema entry.
#   - nbar(z)        Comoving 3D density per slice (from nbar_file in
#                    ~/data/desi/nz_slices/<tracer>_nz_slices.csv).
#   - Σ_perp, Σ_par  Post-reconstruction BAO damping
#                    (`_sigma_nl_post_from_recon`).
#   - b1, M_cut      HOD-weighted Tinker bias and central mass
#                    (`_hod_halo_props`).

BGS:
  tracer_type: BGS
  zrange: [0.1, 0.4]
  z_eff: 0.295                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 9.2e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 1.5
  smoothing_scale: 15.0
  f_interloper: 0.0              # bright low-z sample, essentially no line confusion
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

LRG1:
  tracer_type: LRG
  zrange: [0.4, 0.6]
  z_eff: 0.510                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 8.9e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 2.0
  smoothing_scale: 15.0
  f_interloper: 0.002            # Adame+24 Table 2; LRGs essentially clean
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

LRG2:
  tracer_type: LRG
  zrange: [0.6, 0.8]
  z_eff: 0.706                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 8.9e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 2.0
  smoothing_scale: 15.0
  f_interloper: 0.002            # Adame+24 Table 2
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

LRG3_ELG1:
  tracer_type: MIX
  zrange: [0.8, 1.1]
  z_eff: 0.930                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 5.9e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 1.6
  smoothing_scale: 15.0
  f_interloper: 0.03             # bias-weighted blend of LRG3 (~0.002) and ELG1 (~0.05)
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

ELG2:
  tracer_type: ELG
  zrange: [1.1, 1.6]
  z_eff: 1.317                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 2.9e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 1.2
  smoothing_scale: 15.0
  f_interloper: 0.07             # Adame+24 / Yang+24: [OII] vs OIII/Hβ confusion ~5-10%
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

QSO:
  tracer_type: QSO
  zrange: [0.8, 2.1]
  z_eff: 1.491                   # config-space anchor; = DESI bundle (see header)
  fkp_p0: 5.0e3         # DESI 2024 III Table 2, P0(k=0.14)
  bias_recon: 2.1
  smoothing_scale: 30.0
  f_interloper: 0.02             # Adame+24 Table 2; broad-line catastrophic z
  # QSO redshifts are from broad emission lines (Mg II, C IV) with
  # intrinsic precision ~600 km/s. This contributes LOS smearing
  # comparable to or larger than satellite virial motion and is the
  # dominant component of the Lorentzian FoG scale σs for QSO BAO.
  # Other DESI tracers (BGS, LRG, ELG) use narrow lines with ~50 km/s
  # precision and the contribution is negligible.
  z_error_kms: 600.0
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5

Lya_QSO:
  # Marked unsupported until a proper Lyα forecast (Arinyo-i-Prats bias
  # + β_F + pixel-noise P_N) is wired in.
  supported: false
  zrange: [1.8, 4.2]
  z_eff: 2.33                    # Lyα currently bypasses the n(z) derivation.
  low: 0.5                       # factor x passed[dataset]; box centred on passed
  high: 1.5
  # Lyα flux-bias parameters (Arinyo-i-Prats 2015 model)
  bF0: -0.117
  gamma_bF: 2.9
  # Empirical BAO damping scales at z_ref (placeholder; replace with
  # cosmology-derived values when Lyα is supported)
  Sigma_perp_fid: 5.0
  Sigma_par_fid: 10.0
  # Fiducial growth values used to rescale damping
  sigma8_fid: 0.83
  f_fid: 0.97
  # Effective pixel-noise model
  sigma2_pix: 1.0
  delta_r_pix: 1.0
