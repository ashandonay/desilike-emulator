[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desilike_emulator"
version = "0.1.0"
description = "Neural emulator utilities and training scripts for num_tracers BAO/shapefit covariances."
requires-python = ">=3.8"

# Flat repo layout: the top-level directory is the importable package
# `desilike_emulator` (build_model / decode_emulator_outputs live in util.py).
[tool.setuptools]
packages = ["desilike_emulator", "desilike_emulator.bao", "desilike_emulator.shapefit"]

[tool.setuptools.package-dir]
desilike_emulator = "."
"desilike_emulator.bao" = "bao"
"desilike_emulator.shapefit" = "shapefit"

# pytest is not needed to run any pipeline -- only `pytest tests/`.
[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_cov_scaling.py is a PLOTTING script, not a test, despite the name --
# it is an argparse CLI and pytest would fail collecting it. Confining
# collection to tests/ keeps `pytest` working from the repo root.
norecursedirs = ["bao", "shapefit", "autoresearch", "emulator", "training_data"]
